name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run test suite
        run: pytest tests/ -v
      - name: Run every example script (transpile mode)
        run: |
          for f in examples/*.lb; do
            echo "--- $f ---"
            python lebnene.py "$f"
          done
      - name: Run every example script (interpret mode)
        run: |
          for f in examples/*.lb; do
            echo "--- $f ---"
            python lebnene.py --interpret "$f"
          done
